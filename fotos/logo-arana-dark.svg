<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Telaraña de fondo (sutil, clara para contraste sobre fondo oscuro) -->
  <g stroke="#FAFAFA" stroke-opacity="0.18" stroke-width="4" fill="none">
    <circle cx="256" cy="256" r="200"/>
    <circle cx="256" cy="256" r="140"/>
    <line x1="256" y1="56" x2="256" y2="456"/>
    <line x1="56" y1="256" x2="456" y2="256"/>
    <line x1="115" y1="115" x2="397" y2="397"/>
    <line x1="397" y1="115" x2="115" y2="397"/>
  </g>

  <!-- Patas: 4 por lado, geométricas -->
  <g stroke="url(#grad-dark)" stroke-width="18" stroke-linecap="round" fill="none">
    <!-- Izquierda -->
    <path d="M212 200 L140 140 L96 96"/>
    <path d="M204 240 L118 218 L64 200"/>
    <path d="M204 288 L118 310 L64 330"/>
    <path d="M212 328 L146 386 L104 428"/>
    <!-- Derecha -->
    <path d="M300 200 L372 140 L416 96"/>
    <path d="M308 240 L394 218 L448 200"/>
    <path d="M308 288 L394 310 L448 330"/>
    <path d="M300 328 L366 386 L408 428"/>
  </g>

  <!-- Cuerpo -->
  <circle cx="256" cy="212" r="46" fill="url(#grad-dark)"/>
  <ellipse cx="256" cy="312" rx="62" ry="76" fill="url(#grad-dark)"/>

  <!-- Marca en el abdomen: signo de pesos ($ de punto de venta) -->
  <text x="256" y="336" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="#111827">$</text>

  <!-- Ojos -->
  <circle cx="240" cy="204" r="8" fill="#111827"/>
  <circle cx="272" cy="204" r="8" fill="#111827"/>
</svg>
